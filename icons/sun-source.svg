<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#F49200"/>
    </linearGradient>
  </defs>

  <!-- Warstwa 1: ciemny obrys (kontrast na jasnym pasku) -->
  <g stroke="#3D2B00" stroke-width="11" stroke-linecap="round" fill="#3D2B00">
    <circle cx="64" cy="64" r="26"/>
    <g>
      <line x1="64" y1="9" x2="64" y2="29"/>
      <line x1="64" y1="9" x2="64" y2="29" transform="rotate(45 64 64)"/>
      <line x1="64" y1="9" x2="64" y2="29" transform="rotate(90 64 64)"/>
      <line x1="64" y1="9" x2="64" y2="29" transform="rotate(135 64 64)"/>
      <line x1="64" y1="9" x2="64" y2="29" transform="rotate(180 64 64)"/>
      <line x1="64" y1="9" x2="64" y2="29" transform="rotate(225 64 64)"/>
      <line x1="64" y1="9" x2="64" y2="29" transform="rotate(270 64 64)"/>
      <line x1="64" y1="9" x2="64" y2="29" transform="rotate(315 64 64)"/>
    </g>
  </g>

  <!-- Warstwa 2: bursztynowe wypełnienie (kontrast na ciemnym pasku) -->
  <g stroke="url(#sun)" stroke-width="11" stroke-linecap="round" fill="url(#sun)">
    <circle cx="64" cy="64" r="23"/>
    <g>
      <line x1="64" y1="11" x2="64" y2="28"/>
      <line x1="64" y1="11" x2="64" y2="28" transform="rotate(45 64 64)"/>
      <line x1="64" y1="11" x2="64" y2="28" transform="rotate(90 64 64)"/>
      <line x1="64" y1="11" x2="64" y2="28" transform="rotate(135 64 64)"/>
      <line x1="64" y1="11" x2="64" y2="28" transform="rotate(180 64 64)"/>
      <line x1="64" y1="11" x2="64" y2="28" transform="rotate(225 64 64)"/>
      <line x1="64" y1="11" x2="64" y2="28" transform="rotate(270 64 64)"/>
      <line x1="64" y1="11" x2="64" y2="28" transform="rotate(315 64 64)"/>
    </g>
  </g>
</svg>
